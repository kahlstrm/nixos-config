apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docsight
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kahlstrm/infra.git
    targetRevision: main
    path: local-kubernetes/manifests/docsight
  destination:
    server: https://kubernetes.default.svc
    namespace: docsight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
